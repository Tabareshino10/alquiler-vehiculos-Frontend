<div class="container mt-4">
    <h2>Gestión de Vehículos</h2>

    <div class="row my-3">
        <div class="col-md-4">
            <input type="text" id="placaBusqueda" class="form-control" placeholder="Buscar por placa">
            <button class="btn btn-info mt-2" (click)="buscarPorPlaca()">Buscar Placa</button>
        </div>
        <div class="col-md-4">
            <select id="tipoSelect" class="form-select" (change)="buscarPorTipoDisponibles()">
                <option value="">-- Filtrar Disponibles por Tipo --</option>
                <option value="automovil">Automóvil</option>
                <option value="camioneta">Camioneta</option>
                <option value="moto">Motocicleta</option>
                <option value="campero">campero</option>
                <option value="microbus">microbus</option>
            </select>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" (click)="abrirModal()">Agregar Vehículo</button>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Placa</th>
                <th>Color</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (v of listaV; track v.placa){
            <tr>
                <td>{{ v.placa }}</td>
                <td>{{ v.color }}</td>
                <td>{{ v.idTipoVehiculo }}</td>
                <td>{{ v.estado }}</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2" (click)="actualizar(v)">Editar</button>
                    <button class="btn btn-danger btn-sm" (click)="eliminar(v.placa)">Eliminar</button>
                    <button type="button" class="btn btn-warning btn-sm me-2" [disabled]="v.estado !== 'disponible'"
                        (click)="elegirVehiculo(v)"> Seleccionar
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>

<!-- Modal de Registro/Edición -->
<div id="registro" class="modal" tabindex="-1" style="display: none; background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Registro de Vehículo</h5>
                <button type="button" class="btn-close" (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label>Placa:</label>
                        <input type="text" [(ngModel)]="vehiculo.placa" name="placa" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Color:</label>
                        <input type="text" [(ngModel)]="vehiculo.color" name="color" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Tipo de Vehículo:</label>
                        <select [(ngModel)]="vehiculo.idTipoVehiculo" name="idTipoVehiculo" class="form-select">
                            <option value="automovil">automovil</option>
                            <option value="camioneta">camioneta</option>
                            <option value="moto">motocicleta</option>
                            <option value="campero">campero</option>
                            <option value="microbus">microbus</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Estado:</label>
                        <select [(ngModel)]="vehiculo.estado" name="estado" class="form-select">
                            <option value="disponible">Disponible</option>
                            <option value="alquilado">Alquilado</option>
                            <option value="alquilado">entregado</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
                <button type="button" class="btn btn-success" (click)="guardarVehiculo()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE ALQUILER (Colocar al final del archivo vehiculo.html) -->
<div id="registroAlquiler" style="display: none; background: rgba(0,0,0,0.6); position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; overflow-y: auto;">
  
  <div style="margin: 5% auto; max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); pointer-events: auto;">
    
    <h3 class="mb-4">Solicitar Alquiler</h3>
    
    <!-- Muestra el vehículo asignado -->
    <div class="alert alert-info">
      <strong>Vehículo Seleccionado:</strong> {{ alquiler.vehiculo?.placa }} <br>
      <small>Color: {{ alquiler.vehiculo?.color }}</small>
    </div>

    <!-- Campo Cédula -->
    <div class="form-group mb-3">
      <label class="fw-bold">Cédula del Usuario/Cliente:</label>
      <input type="text" [(ngModel)]="cc" name="cc" class="form-control" placeholder="Ingrese la cédula">
    </div>

    <!-- Campo Fecha Inicio -->
    <div class="form-group mb-3">
      <label class="fw-bold">Fecha de Inicio:</label>
      <input type="date" [(ngModel)]="alquiler.fechaEntregaP" name="fechaEntregaP" class="form-control">
    </div>

    <!-- Campo Fecha Fin -->
    <div class="form-group mb-4">
      <label class="fw-bold">Fecha de Fin (Devolución):</label>
      <input type="date" [(ngModel)]="alquiler.fechaEntregaR" name="fechaEntregaR" class="form-control">
    </div>

    <!-- Botones -->
    <div class="d-flex justify-content-end mt-4">
      <button type="button" class="btn btn-secondary me-2" (click)="cerrarModalAlquiler()">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="guardarAlquiler()">Confirmar Alquiler</button>
    </div>

  </div>
</div>
