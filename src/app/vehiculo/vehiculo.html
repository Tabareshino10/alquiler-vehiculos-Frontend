<div class="container mt-4">
  <h2>Gestión de Vehículos</h2>

  <div class="row my-3">
    <div class="col-md-4">
      <input type="text" id="placaBusqueda" class="form-control" placeholder="Buscar por placa">
      <button class="btn btn-info mt-2" (click)="buscarPorPlaca()">Buscar Placa</button>
    </div>
    <div class="col-md-4">
      <select id="tipoSelect" class="form-select" (change)="buscarPorTipoDisponibles()">
        <option value="">-- Filtrar Disponibles por Tipo --</option>
        <option value="automovil">Automóvil</option>
        <option value="camioneta">Camioneta</option>
        <option value="moto">Moto</option>
      </select>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-primary" (click)="abrirModal()">Agregar Vehículo</button>
    </div>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Placa</th>
        <th>Color</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of listaV">
        <td>{{ v.placa }}</td>
        <td>{{ v.color }}</td>
        <td>{{ v.idTipoVehiculo }}</td>
        <td>{{ v.estado }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="actualizar(v)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminar(v.placa)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal de Registro/Edición -->
<div id="registro" class="modal" tabindex="-1" style="display: none; background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registro de Vehículo</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label>Placa:</label>
            <input type="text" [(ngModel)]="vehiculo.placa" name="placa" class="form-control">
          </div>
          <div class="mb-3">
            <label>Color:</label>
            <input type="text" [(ngModel)]="vehiculo.color" name="color" class="form-control">
          </div>
          <div class="mb-3">
            <label>Tipo de Vehículo:</label>
            <select [(ngModel)]="vehiculo.idTipoVehiculo" name="idTipoVehiculo" class="form-select">
              <option value="automovil">Automóvil</option>
              <option value="camioneta">Camioneta</option>
              <option value="moto">Moto</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Estado:</label>
            <select [(ngModel)]="vehiculo.estado" name="estado" class="form-select">
              <option value="disponible">Disponible</option>
              <option value="alquilado">Alquilado</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-success" (click)="guardarVehiculo()">Guardar</button>
      </div>
    </div>
  </div>
</div>
