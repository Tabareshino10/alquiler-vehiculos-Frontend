<div class="container mt-4">
  <h2>Gestión de Alquileres</h2>

  <div class="mb-3 text-end">
    <button class="btn btn-primary" (click)="solicitarAlquiler()">Solicitar Nuevo Alquiler</button>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Vehículo (Placa)</th>
        <th>Fecha Inicio</th>
        <th>Fecha Entrega Prevista</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of listaA">
        <td>{{ a.idAlquiler }}</td>
        <td>{{ a.idUsuario }}</td>
        <td>{{ a.vehiculo?.placa }}</td>
        <td>{{ a.fechaInicio }}</td>
        <td>{{ a.fechaEntregaP }}</td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-warning': a.estado === 'pendiente',
            'bg-info': a.estado === 'alquilado',
            'bg-success': a.estado === 'finalizado',
            'bg-danger': a.estado === 'cancelado'
          }">
            {{ a.estado }}
          </span>
        </td>
        <td>
          <!-- Botones cuando el estado es 'pendiente' -->
          <button *ngIf="a.estado === 'pendiente'" class="btn btn-warning btn-sm me-1" (click)="cancelar(a.idAlquiler!)">Cancelar</button>
          <button *ngIf="a.estado === 'pendiente'" class="btn btn-info btn-sm me-1" (click)="entregar(a.vehiculo.placa)">Entregar</button>
          
          <!-- Botón cuando el estado es 'alquilado' -->
          <button *ngIf="a.estado === 'alquilado'" class="btn btn-success btn-sm" (click)="devolver(a.idAlquiler!)">Devolver</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal para Solicitar Alquiler -->
<div id="registro" class="modal" tabindex="-1" style="display: none; background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Solicitud de Alquiler</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label>ID Usuario:</label>
            <input type="number" [(ngModel)]="alquiler.idUsuario" name="idUsuario" class="form-control">
          </div>
          <div class="mb-3">
            <label>Seleccionar Vehículo Disponible:</label>
            <select [(ngModel)]="placaSeleccionada" name="placaSeleccionada" class="form-select">
              <option value="">-- Seleccione un Vehículo --</option>
              <option *ngFor="let v of vehiculosDisponibles" [value]="v.placa">
                {{ v.placa }} - {{ v.idTipoVehiculo }} ({{ v.color }})
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label>Fecha Inicio:</label>
            <input type="date" [(ngModel)]="alquiler.fechaInicio" name="fechaInicio" class="form-control">
          </div>
          <div class="mb-3">
            <label>Fecha Entrega Prevista:</label>
            <input type="date" [(ngModel)]="alquiler.fechaEntregaP" name="fechaEntregaP" class="form-control">
          </div>
          <div class="mb-3">
            <label>Valor Alquiler Inicial:</label>
            <input type="number" [(ngModel)]="alquiler.valorAlquiler" name="valorAlquiler" class="form-control">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-success" (click)="guardarAlquiler()">Guardar Alquiler</button>
      </div>
    </div>
  </div>
</div>
