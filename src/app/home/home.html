    </span>

    <span class="fw-semibold text-dark">
      {{ usuario.nombreCompleto }}

    <button class="btn btn-outline-danger btn-sm ms-2" (click)="cerrarSesion()">
      Cerrar sesión
    </button>
  </div>
</nav>
